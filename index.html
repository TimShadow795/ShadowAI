<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowAI</title>
<style>
  :root { --bg:#0a0a0a; --card:#111; --border:#1f1f1f; --muted:#888; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
  body{background:var(--bg);color:#fff;min-height:100vh}
  nav{position:fixed;top:0;width:100%;height:60px;background:rgba(10,10,10,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:40px;z-index:100}
  .nav-btn{background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer}
  .nav-btn.active,.nav-btn:hover{color:#fff}
  .page{display:none;padding-top:80px;min-height:100vh}
  .page.active{display:block}
  .hero{text-align:center;padding:80px 20px}
  .logo{font-size:64px;font-weight:800;letter-spacing:-2px}
  .tag{color:var(--muted);margin:12px 0 28px;font-size:18px}
  .badges{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:36px}
  .badge{background:#151515;border:1px solid #222;padding:6px 14px;border-radius:20px;font-size:12px;color:#ccc}
  .get-btn{background:#fff;color:#000;border:none;padding:14px 40px;border-radius:30px;font-weight:600;cursor:pointer}
  .stats-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:1000px;margin:40px auto;padding:0 20px}
  .stat-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center}
  .stat-card .label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .stat-card .value{font-size:36px;font-weight:700;margin:8px 0}
  .stat-card .sub{font-size:13px;color:var(--muted)}
  .games-section{max-width:900px;margin:40px auto;padding:0 20px 60px}
  .game-row{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:10px}
  .game-info{flex:1}
  .game-name{font-weight:500}
  .game-bar{height:4px;background:#1a1a1a;border-radius:4px;margin-top:6px;overflow:hidden}
  .game-bar-fill{height:100%;background:linear-gradient(90deg,#00ff9d,#00ccff);border-radius:4px}
  .game-count{color:var(--muted);font-size:14px;min-width:60px;text-align:right}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#ff4444}
  .live::before{content:'';width:7px;height:7px;background:#ff4444;border-radius:50%;animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  footer{text-align:center;padding:40px;color:#333;font-size:13px}
</style>
</head>
<body>
<nav>
  <button class="nav-btn active" onclick="go('home')">Home</button>
  <button class="nav-btn" onclick="go('stats')">Live Stats</button>
  <button class="nav-btn" onclick="go('games')">Games</button>
</nav>

<div id="home" class="page active">
  <div class="hero">
    <div class="logo">ShadowAI</div>
    <div class="tag">Best AI for Roblox</div>
    <div class="badges">
      <div class="badge">NO KEY (Groq Free)</div>
      <div class="badge">ALL INJECTORS</div>
      <div class="badge">SOLARA • XENO • WAVE</div>
    </div>
    <button class="get-btn" onclick="copyScript()">Get Script</button>
  </div>
</div>

<div id="stats" class="page">
  <div class="stats-top">
    <div class="stat-card">
      <div class="label">Total Executions</div>
      <div class="value" id="totalExec">—</div>
      <div class="sub" id="dateSub"></div>
    </div>
    <div class="stat-card">
      <div class="label">Active Games</div>
      <div class="value" id="activeGames">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Top Game</div>
      <div class="value" id="topGame" style="font-size:18px">—</div>
      <div class="sub" id="topGameCount"></div>
    </div>
  </div>
</div>

<div id="games" class="page">
  <div class="games-section">
    <h2>Games <span class="live">LIVE</span></h2>
    <div id="gamesList"><div style="color:#555;padding:40px;text-align:center">Loading...</div></div>
  </div>
</div>

<footer>Made by TimShadow • <a href="https://timshadow795.github.io/ShadowAI/" style="color:#555">Website</a></footer>

<script>
const DB = "https://shadowai-eb8f3-default-rtdb.europe-west1.firebasedatabase.app";

function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  event.target.classList.add('active');
}

function copyScript(){
  navigator.clipboard.writeText(`loadstring(game:HttpGet("https://raw.githubusercontent.com/TimShadow795/ShadowAI/refs/heads/main/AI.lua"))()`);
  alert("Copied!");
}

async function load(){
  try{
    const res = await fetch(`${DB}/users.json`);
    const users = await res.json() || {};
    const now = Math.floor(Date.now()/1000);
    const games = {};
    let online = 0;

    for(const u of Object.values(users)){
      if(now - (u.time||0) <= 150){
        online++;
        const name = u.game || "Unknown";
        games[name] = (games[name]||0)+1;
      }
    }

    const sorted = Object.entries(games).sort((a,b)=>b[1]-a[1]);
    document.getElementById("totalExec").textContent = ((online*8)+2400).toLocaleString();
    document.getElementById("activeGames").textContent = sorted.length;
    document.getElementById("dateSub").textContent = new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});

    if(sorted[0]){
      document.getElementById("topGame").textContent = sorted[0][0];
      document.getElementById("topGameCount").textContent = sorted[0][1]+" playing";
    }

    const list = document.getElementById("gamesList");
    if(!sorted.length){
      list.innerHTML = `<div style="color:#555;padding:40px;text-align:center">No active players</div>`;
      return;
    }
    const max = sorted[0][1];
    list.innerHTML = sorted.map(([name,count],i)=>`
      <div class="game-row">
        <div class="game-info">
          <div class="game-name">${i+1}. ${name}</div>
          <div class="game-bar"><div class="game-bar-fill" style="width:${(count/max)*100}%"></div></div>
        </div>
        <div class="game-count">${count}</div>
      </div>
    `).join('');
  }catch(e){console.error(e)}
}
load();
setInterval(load,20000);
</script>
</body>
</html>
