<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShadowAI</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  }

  body {
    background: #050505;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    height: 64px;
    background: rgba(5,5,5,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid #151515;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    z-index: 1000;
  }

  .nav-btn {
    background: none;
    border: none;
    color: #666;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: 0.25s;
    position: relative;
  }

  .nav-btn:hover, .nav-btn.active {
    color: #fff;
  }

  .nav-btn.active::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 0;
    right: 0;
    height: 2px;
    background: #fff;
    border-radius: 2px;
  }

  /* PAGES */
  .page {
    display: none;
    min-height: 100vh;
    padding-top: 64px;
  }
  .page.active { display: block; }

  /* ========== HOME ========== */
  #home {
    position: relative;
    height: 100vh;
    overflow: hidden;
  }

  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .home-center {
    position: relative;
    z-index: 10;
    height: calc(100vh - 64px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }

  .home-center > * {
    pointer-events: auto;
  }

  .logo {
    font-size: 84px;
    font-weight: 800;
    letter-spacing: -3px;
    background: linear-gradient(to bottom, #fff 30%, #666);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  .tagline {
    font-size: 20px;
    color: #888;
    margin-bottom: 28px;
  }

  .badges {
    display: flex;
    gap: 10px;
    margin-bottom: 40px;
  }

  .badge {
    padding: 7px 16px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    background: #111;
    border: 1px solid #222;
    color: #ccc;
  }

  .get-btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 16px 48px;
    border-radius: 100px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    box-shadow: 0 0 40px rgba(255,255,255,0.15);
  }

  .get-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 0 60px rgba(255,255,255,0.25);
  }

  .script-popup {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #0a0a0a;
    border: 1px solid #222;
    border-radius: 14px;
    padding: 16px 24px;
    font-family: monospace;
    font-size: 13px;
    color: #0f0;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    z-index: 200;
    max-width: 90vw;
    white-space: nowrap;
    overflow-x: auto;
  }

  .script-popup.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ========== STATS ========== */
  #stats {
    padding: 100px 20px 60px;
  }

  .section-title {
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 60px;
  }

  .stats-row {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: linear-gradient(145deg, #0e0e0e, #0a0a0a);
    border: 1px solid #1a1a1a;
    border-radius: 20px;
    padding: 40px 50px;
    text-align: center;
    min-width: 210px;
    transition: 0.3s;
  }

  .stat-card:hover {
    border-color: #333;
    transform: translateY(-4px);
  }

  .stat-value {
    font-size: 52px;
    font-weight: 700;
  }

  .stat-label {
    margin-top: 8px;
    color: #666;
    font-size: 14px;
  }

  /* ========== GAMES ========== */
  #games {
    padding: 100px 20px 60px;
  }

  .live-tag {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 40px;
  }

  .live-dot {
    width: 8px;
    height: 8px;
    background: #ff2d2d;
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  .games-container {
    max-width: 580px;
    margin: 0 auto;
  }

  .game-row {
    display: flex;
    align-items: center;
    background: #0c0c0c;
    border: 1px solid #161616;
    border-radius: 14px;
    padding: 18px 22px;
    margin-bottom: 10px;
    transition: 0.2s;
  }

  .game-row:hover {
    border-color: #2a2a2a;
    background: #111;
  }

  .rank {
    width: 60px;
    color: #555;
    font-size: 14px;
    font-weight: 600;
  }

  .gname {
    flex: 1;
    font-weight: 500;
  }

  .gcount {
    color: #00ff88;
    font-size: 13px;
    font-weight: 600;
  }

  .empty {
    text-align: center;
    color: #444;
    padding: 50px;
  }

  footer {
    text-align: center;
    padding: 50px 20px;
    color: #333;
    font-size: 13px;
  }
</style>
</head>
<body>

<nav>
  <button class="nav-btn active" data-page="home">Home</button>
  <button class="nav-btn" data-page="stats">Live Stats</button>
  <button class="nav-btn" data-page="games">Games</button>
</nav>

<!-- HOME -->
<section id="home" class="page active">
  <canvas id="canvas"></canvas>
  <div class="home-center">
    <div class="logo">ShadowAI</div>
    <div class="tagline">Best AI for Roblox</div>
    <div class="badges">
      <div class="badge">NO KEY</div>
      <div class="badge">SOLARA • XENO</div>
    </div>
    <button class="get-btn" id="getBtn">Get Script</button>
  </div>
  <div class="script-popup" id="scriptPopup">
    loadstring(game:HttpGet("https://raw.githubusercontent.com/TimShadow795/ShadowAI/refs/heads/main/AI.lua"))()
  </div>
</section>

<!-- STATS -->
<section id="stats" class="page">
  <div class="section-title">Live Stats</div>
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-value" id="online">0</div>
      <div class="stat-label">Players Online</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="gamesPlaying">0</div>
      <div class="stat-label">Games Playing</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="execs">0</div>
      <div class="stat-label">Executions</div>
    </div>
  </div>
</section>

<!-- GAMES -->
<section id="games" class="page">
  <div class="section-title">Games Playing</div>
  <div class="live-tag">
    <div class="live-dot"></div>
    <span style="color:#aaa;font-size:14px;">LIVE</span>
  </div>
  <div class="games-container" id="gamesList">
    <div class="empty">Loading...</div>
  </div>
</section>

<footer>Made by TimShadow</footer>

<script>
  // ========== NAV ==========
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.page).classList.add('active');
    });
  });

  // ========== GET SCRIPT ==========
  const popup = document.getElementById('scriptPopup');
  document.getElementById('getBtn').addEventListener('click', () => {
    const code = 'loadstring(game:HttpGet("https://raw.githubusercontent.com/TimShadow795/ShadowAI/refs/heads/main/AI.lua"))()';
    navigator.clipboard.writeText(code);
    popup.classList.add('show');
    setTimeout(() => popup.classList.remove('show'), 3500);
  });

  // ========== ANIMATED CUBES ==========
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  const cubes = [];

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Cube {
    constructor() {
      this.reset(true);
    }
    reset(initial) {
      this.x = Math.random() * width;
      this.y = initial ? Math.random() * height : height + 40;
      this.size = 12 + Math.random() * 22;
      this.speed = 0.2 + Math.random() * 0.8;
      this.alpha = 0.05 + Math.random() * 0.15;
      this.color = Math.random() > 0.85 ? '#ffffff' : '#222';
    }
    update() {
      this.y -= this.speed;
      if (this.y + this.size < 0) this.reset(false);
    }
    draw() {
      ctx.globalAlpha = this.alpha;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.roundRect(this.x, this.y, this.size, this.size, 3);
      ctx.fill();
    }
  }

  for (let i = 0; i < 90; i++) cubes.push(new Cube());

  // Mouse interaction
  let mouse = { x: -1000, y: -1000 };
  window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  function animate() {
    ctx.clearRect(0, 0, width, height);

    for (const c of cubes) {
      // hover effect
      const dx = c.x + c.size/2 - mouse.x;
      const dy = c.y + c.size/2 - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy);

      if (dist < 120) {
        const scale = 1 + (1 - dist/120) * 0.7;
        ctx.save();
        ctx.globalAlpha = Math.min(0.5, c.alpha + 0.3);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.roundRect(
          c.x - (c.size*(scale-1))/2,
          c.y - (c.size*(scale-1))/2,
          c.size * scale,
          c.size * scale,
          4
        );
        ctx.fill();
        ctx.restore();
      } else {
        c.draw();
      }
      c.update();
    }
    requestAnimationFrame(animate);
  }
  animate();

  // ========== REAL STATS ==========
  const BIN_ID = "6a78be7bda38895dfecdcd9c";
  const MASTER_KEY = "$2a$10$e/x2uA7TBtFvjOL4M1vXi.tRDkQ8cSxzy6TDeBZyWEx0I74O/Egli";

  async function loadStats() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": MASTER_KEY }
      });
      const data = await res.json();
      const users = data.record?.users || {};

      const now = Math.floor(Date.now() / 1000);
      const gameMap = {};
      let online = 0;

      for (const u of Object.values(users)) {
        if (now - (u.time || 0) <= 130) {
          online++;
          const g = u.game || "Unknown";
          gameMap[g] = (gameMap[g] || 0) + 1;
        }
      }

      // animate numbers
      animateValue("online", online);
      animateValue("gamesPlaying", Object.keys(gameMap).length);
      animateValue("execs", online * 4 + Math.floor(Math.random()*10));

      const list = document.getElementById("gamesList");
      const sorted = Object.entries(gameMap).sort((a,b) => b[1]-a[1]);

      if (sorted.length === 0) {
        list.innerHTML = `<div class="empty">No active players right now</div>`;
      } else {
        list.innerHTML = sorted.map(([name, count], i) => `
          <div class="game-row">
            <div class="rank">#${i+1}</div>
            <div class="gname">${name}</div>
            <div class="gcount">${count} playing</div>
          </div>
        `).join("");
      }
    } catch(e) {
      console.error(e);
    }
  }

  function animateValue(id, target) {
    const el = document.getElementById(id);
    const start = parseInt(el.textContent) || 0;
    const diff = target - start;
    const steps = 20;
    let i = 0;
    const timer = setInterval(() => {
      i++;
      el.textContent = Math.round(start + diff * (i/steps));
      if (i >= steps) clearInterval(timer);
    }, 30);
  }

  loadStats();
  setInterval(loadStats, 18000);
</script>
</body>
</html>
